[project]
name = "dreamstate"
version = "0.1.0"
description = "Sleep-phase self-quizzing: consolidating in-context knowledge into LLM weights with targeted flashcards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tinker>=0.33",
    "transformers>=4.45",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
general-eval = ["datasets>=2.20"]
analysis = ["pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
dreamstate = "dreamstate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dreamstate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
